name: 🔍 Integration Smoke Test

on:
  workflow_dispatch: # Manual trigger for debugging
  push:
    branches: [ main ] # Auto-run on push to main to prevent regression

jobs:
  connectivity-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Smoke Test Dependencies
        run: |
          pip install sqlalchemy psycopg2-binary pandas requests atproto google-api-python-client

      - name: Run Connectivity Test
        env:
          # Syncing with core/config.py naming conventions
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          PYTHONPATH: .
        # Running the test script we'll refine below
        run: python tests/connectivity_check.py
